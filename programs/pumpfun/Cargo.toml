[package]
name = "pumpfun"
version = "0.1.0"
description = "Created with love"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "pumpfun"

[features]
no-entrypoint = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
enable-log = []
devnet = []
mainnet = []
client = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.2", features = ["event-cpi"] }
anchor-spl = { version="0.32.2", features = ["metadata"] }
