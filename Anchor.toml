[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
pumpfun = "2EGBWMwreamZaekLPNQbRnVqvdjC1G9tC7j4pUR8vpxR"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
